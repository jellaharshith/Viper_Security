[project]
name = "viper"
version = "0.7.0"
description = "Human-controlled AI copilot for authorized penetration testing and bug-bounty research"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["security", "pentest", "bug-bounty", "llm", "agents", "audit", "langgraph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["pydantic>=2.7,<3", "pydantic-settings>=2.3,<3", "httpx>=0.27,<1", "qdrant-client>=1.9,<2", "psycopg[binary]>=3.2,<4", "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4", "pyyaml>=6,<7"]

[project.scripts]
viper = "viper.cli:main"

[project.urls]
Homepage = "https://github.com/jellaharshith/Viper_Security"
Issues = "https://github.com/jellaharshith/Viper_Security/issues"
Changelog = "https://github.com/jellaharshith/Viper_Security/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["notebooks"]  # Colab notebooks use shell magics
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
