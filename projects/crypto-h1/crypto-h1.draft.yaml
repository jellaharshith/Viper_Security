project_id: crypto-h1
program_url: https://hackerone.com/crypto
evidence_ref: >-
  HackerOne Crypto.com program scope pages (hackerone.com/crypto and
  hackerone.com/crypto/policy_scopes), checked 2026-11-11. Signal requirement: -1.0 or
  higher (trial reports used below it). Program rules state: "No draining another user's
  funds or blocking their access — automatic disqualification." Hard rules forbid:
  targeting users/employees/staff, social engineering, malware, unauthorized data
  collection, live trading, transfers, or fund movement. Three URL-type assets
  (crypto.com/price, crypto.com/nft, crypto.com/exchange public surface) are noted in
  the policy but not encoded in in_scope as Scope.in_scope expects bare hostnames.
