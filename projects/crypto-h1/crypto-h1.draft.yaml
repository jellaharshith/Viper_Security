ambiguities:
  - >-
    The two account-requiring Extreme-tier assets ("mobile app APIs that require an
    account" and "Exchange APIs that require an account") as well as deep authenticated
    crypto.com/exchange flows are deliberately excluded from this scope pending the
    operator supplying their own authenticated session later.
  - >-
    Smart-contract assets (two mainnet contracts on Cronos and Ethereum CDCETH) require
    Slither/Mythril/Foundry-class tooling Viper does not currently have, and are not
    attempted this round.
  - >-
    Mobile app assets (com.monaco.mobile for iOS and co.mona.android for Android)
    require dedicated APK/IPA reverse engineering and dynamic instrumentation tooling
    (such as Frida), not attempted this round.
  - >-
    Excluded assets designated by the program (GitHub source repositories
    swap-contracts-*, cro-staking, chain-desktop-wallet; Crypto.com Wallet Extension;
    and com.defi.wallet) are explicitly out of scope and never included.
  - >-
    The three URL-type assets (crypto.com/price, crypto.com/nft, and crypto.com/exchange
    public surface) are noted from the program scope table but not encoded into in_scope
    because Scope.in_scope expects exact hostnames or wildcards per the existing model.
  - >-
    Regarding GraphQL introspection on merchant.crypto.com: While the program policy
    notes that GraphQL DoS is capped at $200, confirming GraphQL is an acknowledged
    attack surface, single-query schema introspection is non-destructive and does not
    involve flooding or load testing. Therefore, graphql-introspection is explicitly kept
    in permitted_techniques globally and for merchant.crypto.com, while dos remains
    globally forbidden.
  - >-
    pay.crypto.com was added after merchant.crypto.com's own JS bundle
    (/static/js/main.a1bb00b3.js) revealed its GraphQL endpoint lives at
    https://pay.crypto.com/graphql, not on merchant.crypto.com itself (which serves a
    generic SPA catch-all for every path, including /graphql). Falls under the program's
    own *.crypto.com wildcard tier. Scoped narrowly: port-scan/service-detection/
    passive-scan for basic recon plus graphql-introspection (the one technique with a
    concrete, found reason) only - injection-test, secret-scan, upload-bypass and
    otp-bypass are deliberately NOT granted for this one host given it is a payment
    subdomain, to keep this addition minimal and tied to the actual discovery.
