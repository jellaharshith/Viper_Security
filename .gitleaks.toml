# Gitleaks configuration (picked up automatically by gitleaks-action).
title = "Viper gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known false positives: fake secrets/receipts used by offline unit tests"
# base64("external-token"): a dummy anchor receipt in tests/test_anchor.py, not a credential.
regexes = ['''ZXh0ZXJuYWwtdG9rZW4=''']
# test_probes.py holds intentional fake AWS/Bearer/JWT fixtures that exercise the secret_scan
# probe's detection+redaction; they are test inputs, not real credentials.
paths = [
    '''tests/fixtures/''',
    '''vmapi/tests/test_probes\.py''',
]
